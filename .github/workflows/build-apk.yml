name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37" "build-tools;35.0.0"

      - name: Patch project for API 37
        run: |
          sed -i 's/compileSdk = 35/compileSdk = 37/' app/build.gradle.kts
          echo "android.suppressUnsupportedCompileSdk=37" >> gradle.properties
          grep "compileSdk" app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarvelMobileCamera-APK
          path: app/build/outputs/apk/debug/*.apk
